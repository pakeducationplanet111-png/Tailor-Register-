<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>درزی رجسٹر</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a44;--tape:#f2c230;--bg:#f2f4f8;--card:#fff;--line:#d9dee8;--mute:#5d6b85;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf7;--tape:#f2c230;--bg:#12161f;--card:#1b2230;--line:#2c3649;--mute:#9aa7c0;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Naskh Arabic",Tahoma,serif}
.tape{height:10px;background:repeating-linear-gradient(90deg,var(--tape) 0 14px,var(--ink) 14px 16px)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
h1{margin:0;font-size:22px}
main{max-width:640px;margin:0 auto;padding:8px 16px 90px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:4px 0 12px}
label{font-size:15px;color:var(--mute)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px}
button.main{background:var(--tape);color:#1d2a44;border-color:var(--tape);font-weight:700}
button.del{color:var(--bad)}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.box{max-width:380px;margin:40px auto;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.err{color:var(--bad);min-height:1.6em}
.row{padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.row b{display:block;font-size:18px}
.row span{color:var(--mute);font-size:15px}
.fab{position:fixed;bottom:18px;inset-inline-start:18px;padding:12px 20px;box-shadow:0 2px 8px #0003}
dialog{width:min(420px,92vw);border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:#0006}
.btns{display:flex;gap:8px;justify-content:space-between}
.state{font-size:14px;color:var(--mute);margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="tape"></div>

<section id="boot" class="box"><h1>درزی رجسٹر</h1><p id="bootMsg" class="state">ایپ شروع ہو رہی ہے…</p></section>
<script>
setTimeout(function(){
  if(!window.__ready){
    document.getElementById("bootMsg").textContent="ایپ ابھی Firebase سے جڑی نہیں۔ یہ صفحہ یہاں پریویو میں نہیں چلے گا۔ اسے Firebase Hosting یا کسی ویب سائٹ پر رکھ کر کھولیں، اور فائل میں Firebase کی ترتیب (firebaseConfig) پیسٹ کریں۔";
  }
},3000);
</script>

<!-- لاگ اِن / اکاؤنٹ -->
<section id="auth" class="box" hidden>
  <h1 id="authTitle">لاگ اِن</h1>
  <p class="state">اپنا ای میل اور پاسورڈ لکھیں۔ آپ کا ڈیٹا صرف آپ کو نظر آئے گا۔</p>
  <label for="em">ای میل</label><input id="em" type="email" autocomplete="email" dir="ltr">
  <label for="pw">پاسورڈ (کم از کم 6 حروف)</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">
  <div class="err" id="authErr" role="alert"></div>
  <div class="btns">
    <button class="main" id="authGo">لاگ اِن کریں</button>
    <button id="authSwitch">نیا اکاؤنٹ بنائیں</button>
  </div>
</section>

<!-- کسٹمرز -->
<div id="app" hidden>
  <header><h1>میرے کسٹمرز</h1><button id="out">لاگ آؤٹ</button></header>
  <main>
    <input id="q" type="search" placeholder="نام یا فون نمبر سے تلاش کریں">
    <div class="state" id="st"></div>
    <div id="list"></div>
  </main>
  <button class="main fab" id="add">نیا کسٹمر</button>
</div>

<dialog id="dlg">
  <h1 id="dTitle">نیا کسٹمر</h1>
  <label for="fn">نام</label><input id="fn" autocomplete="off">
  <label for="fp">فون نمبر</label><input id="fp" type="tel" dir="ltr" autocomplete="off">
  <label for="fa">ایڈریس</label><textarea id="fa" rows="3"></textarea>
  <div class="err" id="fe" role="alert"></div>
  <div class="btns">
    <button class="main" id="save">محفوظ کریں</button>
    <button id="cancel">بند کریں</button>
    <button class="del" id="rm" hidden>حذف کریں</button>
  </div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,limit,startAt,endAt} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ← یہاں اپنے Firebase پروجیکٹ کی ترتیب پیسٹ کریں */
const firebaseConfig = {
  apiKey: "AIzaSyBQ83zw7citlz8zvtiDvtnZtBl6zZfr0TE",
  authDomain: "tailor-register-406bc.firebaseapp.com",
  projectId: "tailor-register-406bc",
  appId: "1:824109868080:web:82180839dcf73c5a71f9f5"
};

if (firebaseConfig.apiKey.startsWith("YOUR_")) {
  document.getElementById("bootMsg").textContent = "Firebase کی ترتیب (firebaseConfig) ابھی فائل میں نہیں ڈالی گئی۔ پہلے اسے پیسٹ کریں۔";
  window.__ready = true;
  throw new Error("firebaseConfig missing");
}
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
const $ = id => document.getElementById(id);
let uid = null, unsub = null, editId = null, signup = false, items = new Map();

const authMsg = c => ({
  "auth/invalid-email":"ای میل درست نہیں ہے۔",
  "auth/missing-password":"پاسورڈ لکھیں۔",
  "auth/weak-password":"پاسورڈ کم از کم 6 حروف کا رکھیں۔",
  "auth/email-already-in-use":"یہ ای میل پہلے سے استعمال میں ہے۔ لاگ اِن کریں۔",
  "auth/invalid-credential":"ای میل یا پاسورڈ غلط ہے۔",
  "auth/network-request-failed":"انٹرنیٹ نہیں ہے۔ لاگ اِن کے لیے انٹرنیٹ ضروری ہے۔"
}[c] || "کچھ گڑبڑ ہوئی۔ دوبارہ کوشش کریں۔");

function setMode(s){
  signup = s;
  $("authTitle").textContent = s ? "نیا اکاؤنٹ" : "لاگ اِن";
  $("authGo").textContent = s ? "اکاؤنٹ بنائیں" : "لاگ اِن کریں";
  $("authSwitch").textContent = s ? "پہلے سے اکاؤنٹ ہے؟ لاگ اِن" : "نیا اکاؤنٹ بنائیں";
  $("pw").autocomplete = s ? "new-password" : "current-password";
  $("authErr").textContent = "";
}
$("authSwitch").onclick = () => setMode(!signup);
$("authGo").onclick = async () => {
  $("authErr").textContent = "";
  try {
    const f = signup ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
    await f(auth, $("em").value.trim(), $("pw").value);
  } catch (e) { $("authErr").textContent = authMsg(e.code); }
};
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  window.__ready = true; $("boot").hidden = true;
  uid = u ? u.uid : null;
  $("auth").hidden = !!u;
  $("app").hidden = !u;
  if (unsub) { unsub(); unsub = null; }
  if (u) { $("q").value = ""; load(); } else { $("list").innerHTML = ""; items.clear(); $("pw").value = ""; }
});

/* ہر ٹیلر کا ڈیٹا صرف اس کے اپنے راستے users/{uid}/customers میں جاتا ہے */
const col = () => collection(db, "users", uid, "customers");

function load(){
  if (unsub) unsub();
  const t = $("q").value.trim();
  let q;
  if (!t) q = query(col(), orderBy("createdAt","desc"), limit(40));
  else {
    const field = /^[\d+\s-]/.test(t) ? "phone" : "name";
    q = query(col(), orderBy(field), startAt(t), endAt(t + "\uf8ff"), limit(40));
  }
  unsub = onSnapshot(q, snap => {
    items.clear();
    const list = $("list"); list.innerHTML = "";
    snap.forEach(d => {
      const c = d.data(); items.set(d.id, c);
      const r = document.createElement("div"); r.className = "row"; r.tabIndex = 0;
      const b = document.createElement("b"); b.textContent = c.name || "(بغیر نام)";
      const s = document.createElement("span"); s.textContent = [c.phone, c.address].filter(Boolean).join(" • ");
      r.append(b, s);
      r.onclick = () => openForm(d.id);
      r.onkeydown = e => { if (e.key === "Enter") openForm(d.id); };
      list.append(r);
    });
    const n = snap.size;
    $("st").textContent = n ? (t ? n + " نتائج" : "تازہ ترین کسٹمر") + (snap.metadata.fromCache ? " • آف لائن" : "") : (t ? "کوئی کسٹمر نہیں ملا۔" : "ابھی کوئی کسٹمر نہیں۔ \"نیا کسٹمر\" دبا کر شروع کریں۔");
  }, () => { $("st").textContent = "ڈیٹا نہیں کھل سکا۔ انٹرنیٹ چیک کریں۔"; });
}
let tm; $("q").oninput = () => { clearTimeout(tm); tm = setTimeout(load, 300); };

function openForm(id){
  editId = id || null;
  const c = id ? items.get(id) : {};
  $("dTitle").textContent = id ? "کسٹمر کی معلومات" : "نیا کسٹمر";
  $("fn").value = c.name || ""; $("fp").value = c.phone || ""; $("fa").value = c.address || "";
  $("rm").hidden = !id; $("fe").textContent = "";
  $("dlg").showModal(); $("fn").focus();
}
$("add").onclick = () => openForm();
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = async () => {
  const name = $("fn").value.trim();
  if (!name) { $("fe").textContent = "نام لکھنا ضروری ہے۔"; return; }
  const data = {name, phone: $("fp").value.trim(), address: $("fa").value.trim()};
  $("dlg").close();
  /* آف لائن ہو تو بھی محفوظ ہو جاتا ہے اور انٹرنیٹ آنے پر خود سنک ہوتا ہے */
  try {
    if (editId) await setDoc(doc(col(), editId), data, {merge: true});
    else await addDoc(col(), {...data, createdAt: serverTimestamp()});
  } catch (e) { $("st").textContent = "محفوظ نہیں ہو سکا۔ دوبارہ کوشش کریں۔"; }
};
$("rm").onclick = async () => {
  if (!editId || !confirm("کیا آپ واقعی یہ کسٹمر حذف کرنا چاہتے ہیں؟")) return;
  const id = editId; $("dlg").close();
  try { await deleteDoc(doc(col(), id)); } catch (e) { $("st").textContent = "حذف نہیں ہو سکا۔"; }
};
</script>
</body>
</html>
